services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tradingsim
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tradingsim"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  market-simulator:
    build:
      context: ../market-simulator
      dockerfile: Dockerfile
    ports:
      - "8070:8070"
    environment:
      LISTEN_ADDR: ":8070"
      DATABASE_URL: postgres://admin:secret@postgres:5432/tradingsim
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  agent-orchestrator:
    build:
      context: ../agent-orchestrator
      dockerfile: Dockerfile
    ports:
      - "8071:8071"
    environment:
      MARKET_SIMULATOR_URL: http://market-simulator:8070
    depends_on:
      market-simulator:
        condition: service_started

volumes:
  pgdata:
